; Read only with PHP-FPM/CGI (and LiteSpeed LSAPI), re-read every user_ini.cache_ttl seconds (default 300).
; Only values needed before the script runs: everything else is set with ini_set() in app/bootstrap.php.

upload_max_filesize = 8M
post_max_size = 10M
display_startup_errors = Off
; Overridden at runtime by bootstrap.php; covers errors raised before it runs.
display_errors = Off
